[project]
name = "tc-mcp"
version = "0.1.0"
description = "TestCreator MCP: find, rank, plan, author and export VWO test cases over MCP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastmcp>=4.1.0,<5",
]

[project.scripts]
tc-mcp = "tc_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_mcp"]

# Ship the catalog inside the wheel so `uvx --from git+...` works without a clone.
[tool.hatch.build.targets.wheel.force-include]
"../data/vwo_5000_test_cases.csv" = "tc_mcp/data/vwo_5000_test_cases.csv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
